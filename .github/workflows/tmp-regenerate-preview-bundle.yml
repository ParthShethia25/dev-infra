name: Regenerate preview bundle

on:
  push:
    branches:
      - tmp-regenerate-preview-bundle

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp-regenerate-preview-bundle
      - uses: ./github-actions/npm/checkout-and-setup-node
      - uses: ./github-actions/bazel/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm bazel run //github-actions/previews/upload-artifacts-to-firebase:extract-artifact-metadata
      - name: Commit regenerated bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/ParthShethia25/dev-infra.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git add github-actions/previews/upload-artifacts-to-firebase/extract-artifact-metadata.js
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            HUSKY=0 git commit -m "chore: regenerate preview metadata bundle"
            git push origin HEAD:tmp-regenerate-preview-bundle
          fi
